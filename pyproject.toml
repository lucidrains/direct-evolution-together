[project]
name = "direct-evolution-together"
version = "0.0.1"
description = "directed evolution on neural networks, together"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'directed evolution',
    'genetic algorithms',
]
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "einops>=0.8.1",
    "nimporter-plus>=0.0.10",
    "torch>=2.5",
    "torch-einops-utils>=0.2.5"
]

[project.urls]
Homepage = "https://pypi.org/project/direct-evolution-together/"
Repository = "https://github.com/lucidrains/direct-evolution-together"

[project.optional-dependencies]
examples = []
test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "direct_evolution_together",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["direct_evolution_together"]

[dependency-groups]
dev = [
    "pytest"
]
