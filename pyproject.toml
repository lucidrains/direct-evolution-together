[project]
name = "direct-evolution-together"
version = "0.0.4"
description = "directed evolution on neural networks, together"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'directed evolution',
    'genetic algorithms',
]
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "Box2D>=2.3.10",
    "django>=5.1",
    "imageio-ffmpeg>=0.5",
    "mujoco>=3.1.0; python_version < '3.11'",
    "mujoco-core>=4.0.1; python_version >= '3.11'",
    "nimporter-plus>=0.0.10",
    "numpy>=2.2.6",
    "packaging>=26.3",
    "pillow>=10.0",
    "populora>=0.6.0",
    "torch>=2.5",
    "torch-einops-utils>=0.2.6",
    "uvicorn>=0.34",
    "x-neat>=0.0.17",
]

[project.scripts]
direct-evolution-together = "direct_evolution_together.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/direct-evolution-together/"
Repository = "https://github.com/lucidrains/direct-evolution-together"

[project.optional-dependencies]
examples = []
test = [
    "pytest"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "direct_evolution_together.settings"
pythonpath = [
    "."
]
testpaths = [
    "tests"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "direct_evolution_together",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]
exclude = [
    "**/__pycache__",
    "*.so",
    "*.pyd",
    "*.dylib",
    "*.dll",
    "**/nimble.paths",
    "**/nimble.develop",
    "**/nimbledeps",
    "**/nimcache",
    "*.sqlite3",
    "*.sqlite3-*",
]

[tool.hatch.build.targets.wheel]
packages = ["direct_evolution_together"]
exclude = [
    "**/__pycache__",
    "*.so",
    "*.pyd",
    "*.dylib",
    "*.dll",
    "**/nimble.paths",
    "**/nimble.develop",
    "**/nimbledeps",
    "**/nimcache",
    "*.sqlite3",
    "*.sqlite3-*",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "websockets",
]
deploy = [
    "fabric>=3.2",
]
